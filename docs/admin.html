<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c83232">
  <meta name="description" content="Private PokéDrop Watch subscriber administration.">
  <title>Admin · PokéDrop Watch</title>
  <link rel="icon" href="./pokeball.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <style>
    html, body { min-height: 100%; margin: 0; }
    .admin-embed-topbar {
      position: sticky;
      top: 0;
      z-index: 300;
      background: rgba(247,247,244,.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(30,30,25,.07);
    }
    .admin-embed-main { max-width: 1280px; margin: 0 auto; padding: 0 0 12px; }
    #adminPortalFrame {
      display: block;
      width: 100%;
      height: calc(100vh - 79px);
      height: calc(100dvh - 79px);
      min-height: 520px;
      border: 0;
      background: #f7f7f4;
    }
    @media (max-width: 600px) {
      .admin-embed-main { padding-bottom: env(safe-area-inset-bottom); }
      #adminPortalFrame { height: calc(100vh - 65px); height: calc(100dvh - 65px); min-height: 500px; }
    }
  </style>
</head>
<body>
  <div class="site-shell admin-embed-shell">
    <header class="topbar admin-embed-topbar">
      <a class="brand" href="./" aria-label="PokéDrop Watch main page">
        <span class="pokeball" aria-hidden="true"><i></i></span>
        <span><strong>PokéDrop</strong><small>ADMIN</small></span>
      </a>
      <a class="text-link" href="./" aria-label="Return to the main PokéDrop Watch page">← Main website</a>
    </header>
    <main class="admin-embed-main">
      <iframe
        id="adminPortalFrame"
        src="https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin"
        title="PokéDrop Watch private administrator portal"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </main>
  </div>
</body>
</html>
