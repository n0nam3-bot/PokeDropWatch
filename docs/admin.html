<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c83232">
  <meta name="description" content="Private PokéDrop Watch subscriber administration.">
  <title>Admin · PokéDrop Watch</title>
  <link rel="icon" href="./pokeball.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme-overrides.css">
  <style>
    .admin-embed-shell { max-width:1320px; padding:0 24px; }
    .admin-embed-topbar { position:sticky; top:0; z-index:300; background:rgba(247,247,244,.97); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 1px 0 rgba(30,30,25,.07); }
    .admin-embed-main { max-width:1280px; margin:0 auto; padding:0 0 10px; }
    #adminPortalFrame { display:block; width:100%; height:calc(100vh - var(--topbar-height) - var(--bottom-bar-height) - 22px - env(safe-area-inset-bottom)); height:calc(100dvh - var(--topbar-height) - var(--bottom-bar-height) - 22px - env(safe-area-inset-bottom)); min-height:560px; border:0; background:#fbf8f5; }
    .portal-fallback { display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0 12px; color:#85867f; font-size:10px; text-align:center; }
    .portal-fallback a { color:var(--red-dark); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .bottom-bar a[aria-current="page"] { background:#fff2ee; color:var(--red-dark); }
    @media(max-width:700px) { .admin-embed-shell { padding:0 12px; } #adminPortalFrame { min-height:620px; } }
  
    .portal-launch-panel { min-height:360px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; padding:34px 24px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(145deg,#fffdfa,#f7f1ed); box-shadow:var(--shadow); text-align:center; }
    .portal-launch-icon { width:58px; height:58px; display:grid; place-items:center; border-radius:16px; background:#fff0ea; color:var(--red-dark); font-size:25px; }
    .portal-launch-copy { max-width:620px; }
    .portal-launch-copy h2 { margin:4px 0 8px; font:750 clamp(21px,3vw,29px)/1.15 system-ui,sans-serif; letter-spacing:-.7px; }
    .portal-launch-copy p:last-child { margin:0; color:#777970; font-size:13px; line-height:1.65; }
    .portal-launch-actions { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px; margin-top:5px; }
    .portal-launch-primary { display:inline-flex; min-height:44px; align-items:center; justify-content:center; padding:0 19px; border-radius:9px; background:var(--red-dark); color:#fff; font-size:11px; font-weight:850; letter-spacing:.5px; text-decoration:none; }
    .portal-launch-secondary { color:var(--red-dark); font-size:12px; font-weight:750; text-decoration:underline; text-underline-offset:3px; }
    @media(max-width:520px) { .portal-launch-panel { min-height:320px; padding:26px 16px; } .portal-launch-actions { width:100%; flex-direction:column; } .portal-launch-primary { width:min(100%,320px); } }
  </style>
</head>
<body class="page-admin">
  <div class="site-shell admin-embed-shell" id="top">
    <header class="topbar admin-embed-topbar" id="pageTop">
      <a class="brand" href="./#top" aria-label="PokéDrop Watch home">
        <img class="page-ball" src="./assets/icons/masterball-8bit.png" alt="">
        <span><strong>PokéDrop</strong><small>GYM LEADER</small></span>
      </a>
      <div class="topbar-right">
        <button id="refreshAdminButton" class="icon-button" type="button" aria-label="Refresh admin portal" title="Refresh admin portal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg>
        </button>
      </div>
    </header>
    <main class="admin-embed-main">
<section class="portal-launch-panel" aria-label="Admin portal">
      <div class="portal-launch-icon" aria-hidden="true">⚙</div>
      <div class="portal-launch-copy">
        <p class="eyebrow">GOOGLE APPS SCRIPT PORTAL</p>
        <h2>Open subscriber administration</h2>
        <p>The administrator portal is opened directly so Google can use its normal first-party sign-in and security cookies.</p>
      </div>
      <div class="portal-launch-actions">
        <a class="portal-launch-primary" href="https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin" target="_blank" rel="noopener noreferrer">OPEN ADMIN IN NEW TAB ↗</a>
        <a class="portal-launch-secondary" href="https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin">Open in this tab</a>
      </div>
    </section>
    </main>
  </div>
  <nav class="bottom-bar" aria-label="Quick navigation">
    <div class="bottom-bar-inner">
      <a href="./#top"><span aria-hidden="true">⌂</span><small>Home</small></a>
      <a href="./#alerts"><span aria-hidden="true">▤</span><small>Alerts</small></a>
      <a href="./notify.html"><span aria-hidden="true">✉</span><small>Notify</small></a>
      <a href="./admin.html" aria-current="page"><span aria-hidden="true">⚙</span><small>Admin</small></a>
      <a href="https://github.com/n0nam3-bot/PokeDropWatch" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">↗</span><small>GitHub</small></a>
    </div>
  </nav>
  <script>// POKEDROP_ADMIN_TOP_LEVEL_PORTAL_V2
document.getElementById('refreshAdminButton').addEventListener('click', () => window.location.assign('https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin'));</script>
  <script src="./page-enhancements.js" defer></script>
</body>
</html>
