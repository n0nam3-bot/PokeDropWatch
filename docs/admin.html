<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c83232">
  <meta name="description" content="Private PokéDrop Watch subscriber administration.">
  <title>Admin · PokéDrop Watch</title>
  <link rel="icon" href="./pokeball.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .portal-launch-shell { max-width:1320px; padding:0 24px; }
    .portal-launch-topbar { position:sticky; top:0; z-index:300; background:rgba(247,247,244,.97); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 1px 0 rgba(30,30,25,.07); }
    .portal-launch-main { max-width:760px; min-height:calc(100dvh - var(--topbar-height) - var(--bottom-bar-height) - 36px); margin:0 auto; display:grid; place-items:center; padding:24px 0 36px; }
    .launch-card { width:100%; padding:clamp(22px,4vw,38px); border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:var(--shadow); text-align:center; }
    .launch-card h1 { margin:0 0 10px; font:700 clamp(22px,4vw,32px)/1.2 system-ui,sans-serif; letter-spacing:-.7px; }
    .launch-card p { color:var(--muted); font-size:12px; line-height:1.7; }
    .launch-link { display:inline-flex; align-items:center; justify-content:center; min-height:44px; margin-top:12px; padding:10px 18px; border-radius:8px; background:var(--red); color:#fff; font-size:11px; font-weight:800; text-decoration:none; }
    .bottom-bar a[aria-current="page"] { background:#fff2ee; color:var(--red-dark); }
    @media(max-width:700px) { .portal-launch-shell { padding:0 12px; } }
  </style>
</head>
<body>
  <div class="site-shell portal-launch-shell" id="top">
    <header class="topbar portal-launch-topbar" id="pageTop">
      <a class="brand" href="./#top" aria-label="PokéDrop Watch home">
        <span class="pokeball" aria-hidden="true"><i></i></span>
        <span><strong>PokéDrop</strong><small>WATCH</small></span>
      </a>
      <div class="topbar-right">
        <span class="live-pill"><span class="live-dot"></span> AUTOMATED WATCH</span>
      </div>
    </header>
    <main class="portal-launch-main">
      <section class="launch-card">
        <p class="eyebrow">TRAINER ALERT MANAGEMENT</p>
        <h1>Opening administrator portal</h1>
        <p>The secure portal is opening as a regular page rather than inside an embedded Google frame. This avoids browser third-party-cookie restrictions.</p>
        <a class="launch-link" href="https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin">Open Admin directly ↗</a>
      </section>
    </main>
  </div>
  <nav class="bottom-bar" aria-label="Quick navigation">
    <div class="bottom-bar-inner">
      <a href="./#top"><span aria-hidden="true">⌂</span><small>Home</small></a>
      <a href="./#alerts"><span aria-hidden="true">▤</span><small>Alerts</small></a>
      <a href="./notify.html"><span aria-hidden="true">✉</span><small>Notify</small></a>
      <a href="./admin.html" aria-current="page"><span aria-hidden="true">⚙</span><small>Admin</small></a>
      <a href="https://github.com/n0nam3-bot/PokeDropWatch" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">↗</span><small>GitHub</small></a>
    </div>
  </nav>
  <script>
    (() => {
      const portalUrl = 'https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin';
      window.location.replace(portalUrl);
    })();
  </script>
</body>
</html>
