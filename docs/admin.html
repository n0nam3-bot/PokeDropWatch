<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c83232">
  <meta name="description" content="Private PokéDrop Watch subscriber administration.">
  <title>Admin · PokéDrop Watch</title>
  <link rel="icon" href="./pokeball.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <style>
    html, body { min-height: 100%; margin: 0; }
    .admin-embed-topbar {
      position: sticky;
      top: 0;
      z-index: 300;
      background: rgba(247,247,244,.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(30,30,25,.07);
    }
    .admin-embed-main { max-width: 1280px; margin: 0 auto; padding: 0; }
    #adminPortalFrame {
      display: block;
      width: 100%;
      height: calc(100vh - var(--topbar-height) - var(--bottom-bar-height) - env(safe-area-inset-bottom));
      height: calc(100dvh - var(--topbar-height) - var(--bottom-bar-height) - env(safe-area-inset-bottom));
      min-height: 420px;
      border: 0;
      background: #f7f7f4;
    }
    .bottom-bar a[aria-current="page"] {
      background: #fff2ee;
      color: var(--red-dark);
    }
    @media (max-width: 700px) {
      .admin-embed-main { padding-bottom: env(safe-area-inset-bottom); }
      #adminPortalFrame { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="site-shell admin-embed-shell">
    <header class="topbar admin-embed-topbar" id="pageTop">
      <a class="brand" href="./" aria-label="PokéDrop Watch home">
        <span class="pokeball" aria-hidden="true"><i></i></span>
        <span><strong>PokéDrop</strong><small>WATCH</small></span>
      </a>
      <div class="topbar-right">
        <span class="live-pill"><span class="live-dot"></span> AUTOMATED WATCH</span>
        <button id="refreshAdminButton" class="icon-button" type="button" aria-label="Refresh admin portal" title="Refresh admin portal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg>
        </button>
      </div>
    </header>
    <main class="admin-embed-main">
      <iframe
        id="adminPortalFrame"
        src="https://script.google.com/macros/s/AKfycbwGfc1E_t1nj-HG5Sf5V1Y-J_cwY_PmwLIUAfbPPBVtl7mbxOhCkz5Q6BNosWmEUmVm/exec?page=admin"
        title="PokéDrop Watch private administrator portal"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </main>
  </div>
  <nav class="bottom-bar" aria-label="Quick navigation">
    <div class="bottom-bar-inner">
      <a href="./#pageTop"><span aria-hidden="true">⌂</span><small>Home</small></a>
      <a href="./#alerts"><span aria-hidden="true">▤</span><small>Alerts</small></a>
      <a href="./#subscriptions"><span aria-hidden="true">✉</span><small>Notify</small></a>
      <a href="./admin.html" aria-current="page"><span aria-hidden="true">⚙</span><small>Admin</small></a>
      <a href="https://github.com/n0nam3-bot/PokeDropWatch" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">↗</span><small>GitHub</small></a>
    </div>
  </nav>
  <script>
    document.getElementById('refreshAdminButton').addEventListener('click', () => window.location.reload());
  </script>
</body>
</html>
