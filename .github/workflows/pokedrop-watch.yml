name: PokéDrop Watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'install.zip'
      - 'updates/**.zip'

permissions:
  contents: write

concurrency:
  group: pokedrop-watch
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install initial package ZIP (one-time setup)
        run: |
          if [ ! -f install.zip ]; then
            echo "No initial install ZIP uploaded."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat, zipfile
          archive = Path('install.zip')
          root = Path.cwd().resolve()
          if not zipfile.is_zipfile(archive):
              raise SystemExit('install.zip is not a valid ZIP archive')
          with zipfile.ZipFile(archive) as zf:
              files = [x for x in zf.infolist() if not x.is_dir()]
              if len(files) > 1500 or sum(x.file_size for x in files) > 75 * 1024 * 1024:
                  raise SystemExit('Install ZIP is too large or contains too many files')
              plan = []
              for entry in files:
                  rel = PurePosixPath(entry.filename.replace('\\', '/'))
                  if rel.is_absolute() or not rel.parts or any(p in {'', '.', '..'} for p in rel.parts):
                      raise SystemExit(f'Unsafe ZIP path: {entry.filename}')
                  if rel.parts[0] in {'.git', '.github', 'updates'}:
                      raise SystemExit(f'Install ZIP may not write to {rel.parts[0]}/')
                  mode = (entry.external_attr >> 16) & 0xffff
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Symlink rejected: {entry.filename}')
                  dest = (root / Path(*rel.parts)).resolve()
                  if root not in dest.parents:
                      raise SystemExit(f'Unsafe destination: {entry.filename}')
                  plan.append((entry, dest))
              for entry, dest in plan:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(entry) as src, dest.open('wb') as out:
                      while chunk := src.read(1024 * 1024):
                          out.write(chunk)
                  print(f'Installed {dest.relative_to(root)}')
          archive.unlink()
          Path('updates').mkdir(exist_ok=True)
          Path('updates/.gitkeep').touch(exist_ok=True)
          PY

      - name: Apply uploaded update ZIP patches
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(updates/*.zip)
          for zip_file in "${zips[@]}"; do
            if [ ! -f scripts/apply_patch.py ]; then
              echo "Patch installer is missing; install the main package ZIP first."
              exit 1
            fi
            python scripts/apply_patch.py "$zip_file"
            rm -f "$zip_file"
          done

      - name: Install scanner dependencies
        run: |
          if [ -f monitor/requirements.txt ]; then
            python -m pip install -r monitor/requirements.txt
          else
            echo "Initial package is not installed yet."
          fi

      - name: Scan sources and send email digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -f monitor/run.py ]; then
            python monitor/run.py
          else
            echo "Waiting for the initial package ZIP."
          fi

      - name: Commit installed files and dashboard status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update PokéDrop Watch"
            git push
          fi
