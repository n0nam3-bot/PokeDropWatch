<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéDrop Watch verification bridge</title>
</head>
<body>
<script>
  const SITE_ORIGIN = <?!= JSON.stringify(siteOrigin) ?>;
  const ALLOWED_ORIGIN = (() => {
    try {
      return new URL(SITE_ORIGIN).origin;
    } catch (_error) {
      return 'https://n0nam3-bot.github.io';
    }
  })();
  const CHANNEL = 'pokedrop-watch-verification-v1';

  function postToSite(message, targetOrigin = ALLOWED_ORIGIN) {
    window.top.postMessage(message, targetOrigin);
  }

  function replyToCaller(requestId, result, targetOrigin, callerWindow) {
    const message = { channel: CHANNEL, requestId, result };
    try {
      if (callerWindow && typeof callerWindow.postMessage === 'function') {
        callerWindow.postMessage(message, targetOrigin);
        return;
      }
    } catch (_error) {
      // Fall through to the top-window route for nested Apps Script frames.
    }
    postToSite(message, targetOrigin);
  }

  function invokeServerAction(action, payload, onSuccess, onFailure) {
    const runner = google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onFailure);

    switch (action) {
      case 'requestCode':
        runner.requestVerificationCode(payload);
        return;
      case 'verifyCode':
        runner.verifyVerificationCode(payload);
        return;
      case 'adminLogin':
        runner.adminLogin(payload);
        return;
      case 'adminListSubscribers':
        runner.adminListSubscribers(payload);
        return;
      case 'adminUpdateSubscriber':
        runner.adminUpdateSubscriber(payload);
        return;
      case 'adminLogout':
        runner.adminLogout(payload);
        return;
      case 'requestAdminPasswordReset':
        runner.requestAdminPasswordReset(payload);
        return;
      case 'completeAdminPasswordReset':
        runner.completeAdminPasswordReset(payload);
        return;
      default:
        throw new Error('Unsupported backend action: ' + String(action || 'empty'));
    }
  }

  window.addEventListener('message', event => {
    // Origin is the trust boundary. HtmlService may wrap the page in a nested
    // Google-hosted frame, so do not assume the caller is window.parent/top.
    if (event.origin !== ALLOWED_ORIGIN) return;

    const message = event.data || {};
    if (message.channel !== CHANNEL || !message.requestId) return;

    const requestId = String(message.requestId);
    const targetOrigin = event.origin;
    const callerWindow = event.source;
    const reply = result => replyToCaller(requestId, result, targetOrigin, callerWindow);

    try {
      invokeServerAction(
        message.action,
        message.payload || {},
        result => reply(result || {
          ok: false,
          message: 'The Apps Script backend completed without returning a result.'
        }),
        error => reply({
          ok: false,
          message: (error && error.message) || 'Verification service is unavailable. Please try again.'
        })
      );
    } catch (error) {
      reply({
        ok: false,
        message: (error && error.message) || 'The verification request could not be started.'
      });
    }
  });

  // Readiness only means the bridge page loaded. An actual request must still
  // receive a correlated response from Apps Script before an email is claimed.
  postToSite({ channel: CHANNEL, ready: true, bridgeVersion: 2 });
</script>
</body>
</html>
